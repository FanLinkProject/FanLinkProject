# GitHub Actions → ECR push → SSM → EC2 /opt/fanlink → docker compose
# Secrets: AWS_REGION, EC2_INSTANCE_ID, ECR_URI, GHA_DEPLOY_ROLE_ARN
# EC2에는 .env, keys(PEM) 이미 존재

name: Deploy Backend (dev)

on:
  push:
    branches: ["dev"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  ECR_URI: ${{ secrets.ECR_URI }}
  DEPLOY_ROLE_ARN: ${{ secrets.GHA_DEPLOY_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: fanlink-deploy-dev

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: Dockerfile
          push: true
          tags: |
            ${{ env.ECR_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2 via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_URI: ${{ env.ECR_URI }}
        run: |
          set -euo pipefail
          # JSON으로 전달해 quoting 문제 방지 (IMAGE_TAG, ECR_URI 전달)
          PARAMS=$(python3 -c "
          import json, os
          cmd = 'sudo bash /opt/fanlink/deploy.sh ' + os.environ['IMAGE_TAG'] + ' ' + os.environ['ECR_URI']
          print(json.dumps({'commands': [cmd]}))
          ")
          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "fanlink backend deploy ${IMAGE_TAG}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM CommandId: ${COMMAND_ID}"

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

          OUT=$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)
          echo "$OUT" | python3 -m json.tool

          STATUS=$(echo "$OUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('Status',''))")
          if [[ "$STATUS" != "Success" ]]; then
            echo "[ERROR] SSM command status: ${STATUS}"
            exit 1
          fi
