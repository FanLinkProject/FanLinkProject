name: Deploy Backend (dev, SSM)

on:
  push:
    branches: ["dev"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: true

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}            # ap-northeast-2
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}  # i-xxxxxxxxxxxxxxxxx
      ECR_URI: ${{ secrets.ECR_URI }}                  # 0582...dkr.ecr.ap-northeast-2.amazonaws.com/fanlink-backend
      DEPLOY_ROLE_ARN: ${{ secrets.GHA_DEPLOY_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ OIDC AssumeRole (여기서 자격증명 확정)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: fanlink-deploy-dev

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ tag=GITHUB_SHA
      - name: Build & Push backend image (tag=GITHUB_SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ✅ SSM으로 EC2에 "deploy.sh <sha>" 실행 (SSH 불필요)
      - name: Deploy on EC2 via SSM
        run: |
          set -euo pipefail
          COMMAND_ID=$(
            aws ssm send-command \
              --region "${AWS_REGION}" \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "fanlink backend deploy: ${GITHUB_SHA}" \
              --parameters commands="sudo bash /opt/fanlink/deploy.sh ${GITHUB_SHA}" \
              --query "Command.CommandId" \
              --output text
          )
          echo "SSM CommandId: ${COMMAND_ID}"

          # wait
          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

          # fetch output
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
