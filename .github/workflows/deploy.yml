name: Deploy backend to EC2 (SSM + Docker Compose)

on:
  push:
    branches: [ "dev" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ROLE_TO_ASSUME: arn:aws:iam::058264188049:role/fanlink-github-actions-deploy-role
  EC2_INSTANCE_ID: i-014bd83d14bf502d9
  ECR_URI: 058264188049.dkr.ecr.ap-northeast-2.amazonaws.com/fanlink-backend
  ECR_REPO: fanlink-backend
  SSM_ENV_PARAM: /fanlink/prod/backend/envfile

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push backend image (tag=GITHUB_SHA)
        working-directory: backend
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_URI: ${{ env.ECR_URI }}
        run: |
          set -euo pipefail
          docker build -t "${ECR_URI}:${IMAGE_TAG}" .
          docker push "${ECR_URI}:${IMAGE_TAG}"

      - name: Deploy on EC2 via SSM (run /opt/fanlink/deploy.sh <tag>)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # NOTE: SSM runs via /bin/sh by default -> do NOT use "set -o pipefail" inside remote script.
          # We explicitly run "bash -lc" on the instance to guarantee bash.
          COMMAND_ID="$(
            aws ssm send-command \
              --region "${AWS_REGION}" \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "fanlink deploy backend ${IMAGE_TAG}" \
              --parameters commands="bash -lc '
                set -euo pipefail
                cd /opt/fanlink
                sudo ./deploy.sh ${IMAGE_TAG}
              '" \
              --query "Command.CommandId" --output text
          )"

          echo "SSM CommandId=${COMMAND_ID}"

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          STATUS="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "Status" --output text)"

          if [[ "${STATUS}" != "Success" ]]; then
            echo "[ERROR] SSM command failed: ${STATUS}"
            exit 1
          fi