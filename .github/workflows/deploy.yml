name: deploy-backend-ssm

on:
  push:
    branches: ["dev"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  SSM_DOCUMENT_NAME: AWS-RunShellScript
  DEPLOY_COMMAND: "sudo /opt/fanlink/deploy.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::058264188049:role/fanlink-github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Send SSM Run Command (tag targets)
        id: send
        shell: bash
        run: |
          set -euo pipefail
          echo "Sending SSM command to targets: tag:Project=FanLink, tag:Env=prod"
          COMMAND_ID="$(
            aws ssm send-command \
              --document-name "$SSM_DOCUMENT_NAME" \
              --targets "Key=tag:Project,Values=FanLink" "Key=tag:Env,Values=prod" \
              --parameters "commands=[\"$DEPLOY_COMMAND\"]" \
              --comment "fanlink deploy: ${GITHUB_SHA}" \
              --region "$AWS_REGION" \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $COMMAND_ID"

      - name: Wait for command completion (poll)
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID="${{ steps.send.outputs.command_id }}"
          echo "Polling SSM command invocations for CommandId=$COMMAND_ID"

          TIMEOUT_SEC=1200
          INTERVAL_SEC=10
          NO_TARGET_TIMEOUT=120
          ELAPSED=0
          NO_TARGET_ELAPSED=0

          while true; do
            COUNT="$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --region "$AWS_REGION" \
              --query 'length(CommandInvocations)' \
              --output text 2>/dev/null || echo 0)"

            echo "invocation_count=$COUNT elapsed=${ELAPSED}s"

            if [[ "$COUNT" == "0" ]]; then
              NO_TARGET_ELAPSED=$((NO_TARGET_ELAPSED + INTERVAL_SEC))
              if [[ "$NO_TARGET_ELAPSED" -ge "$NO_TARGET_TIMEOUT" ]]; then
                echo "No instance received the command after ${NO_TARGET_TIMEOUT}s."
                echo "Check EC2 tags (Project=FanLink, Env=prod) and SSM ManagedInstance Online."
                exit 1
              fi
            else
              STATUSES="$(aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --details \
                --region "$AWS_REGION" \
                --query 'CommandInvocations[].Status' \
                --output text)"

              echo "Statuses: $STATUSES"

              if echo "$STATUSES" | grep -Eqi 'Failed|Cancelled|TimedOut'; then
                echo "One or more invocations failed. Dumping details..."
                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details \
                  --region "$AWS_REGION" \
                  --output json
                exit 1
              fi

              if echo "$STATUSES" | awk '{for(i=1;i<=NF;i++) if($i!="Success") exit 1; exit 0;}'; then
                echo "All invocations succeeded."
                break
              fi
            fi

            if [[ "$ELAPSED" -ge "$TIMEOUT_SEC" ]]; then
              echo "Timeout waiting for SSM command completion."
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --details \
                --region "$AWS_REGION" \
                --output json
              exit 1
            fi

            sleep "$INTERVAL_SEC"
            ELAPSED=$((ELAPSED + INTERVAL_SEC))
          done

      - name: Show command output (best-effort)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID="${{ steps.send.outputs.command_id }}"
          echo "Fetching plugin outputs (best-effort)."
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --region "$AWS_REGION" \
            --output json || true

      - name: Notes (instance-id 사용 시)
        run: |
          echo '인스턴스 ID로 직접 지정하려면 send-command 단계에서 아래처럼 바꾸면 됨:'
          echo '  --targets "Key=InstanceIds,Values=i-xxxxxxxxx"'
          echo '그 외 로직(폴링/출력)은 동일.'
