server:
  port: 8080

spring:
  datasource:
    # 한글 깨짐 방지
    # - characterEncoding은 "utf8mb4"가 아니라 자바 charset 이름인 "UTF-8"을 써야 합니다.
    # - 실제 저장/정렬은 서버/테이블의 utf8mb4 + connectionCollation으로 처리됩니다.
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:fanlinkdb}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&useSSL=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:

      maximum-pool-size: ${DB_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

      leak-detection-threshold: ${DB_LEAK_DETECT_MS:0}
  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    show-sql: true

  #===============================
  data:
    redis:
      host: localhost
      port: 6379

  # 이메일 발송 설정 (Gmail SMTP 예시)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    # 이메일 개발 모드 설정
    # true: 개발 모드 (콘솔에 인증 코드 출력, 실제 이메일 발송 안 함)
    # false: 실제 이메일 발송
    dev-mode: ${MAIL_DEV_MODE:true}

  # SMS API 설정 (실제 SMS 발송을 위한 설정 - CoolSMS)
  sms:
    api:
      # false: 개발 모드 (로그만 출력), true: 실제 SMS 발송
      enabled: ${SMS_API_ENABLED:false}
      key: ${SMS_API_KEY}
      secret: ${SMS_API_SECRET}
      # 발신번호 (CoolSMS에 등록된 번호)
      from: ${SMS_FROM}
  # 암호화 키 설정 (환경 변수 ENCRYPTION_KEY로 설정 가능, 32바이트 권장)
  # 프로덕션 환경에서는 반드시 환경 변수로 설정하세요
  encryption:
    key: ${ENCRYPTION_KEY:default-encryption-key-32bytes!!}

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_GROUP_ID:chat-server}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    # (선택) consumer가 Json으로 받을 거면 설정 필요
    listener:
      missing-topics-fatal: false

  # 시큐리티 및 OAuth2 - 클라이언트 설정
  security:
    oauth2:
      client:
        registration:
          # 카카오 + 커스텀 설정
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # OAuth2 인증 후 리다이렉트될 백엔드 URI (Spring Security 기본 형식)
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            # 클라이언트 인증 방식: POST 방식으로 Client Secret 전송
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname  # 프로필 닉네임
              - profile_image     # 프로필 사진
              - account_email      # 계정 이메일
              - name              # 이름
              - gender            # 성별
              - age_range         # 연령대
              - birthday          # 생일
              - birthyear         # 출생 연도
              - phone_number      # 전화번호
            client-name: Kakao

          # 구글 + ?
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

          # Naver + 커스텀 설정
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
            provider: naver

          # Instagram + 커스텀 설정
          instagram:
            client-id: ${INSTAGRAM_CLIENT_ID}
            client-secret: ${INSTAGRAM_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/instagram
            scope:
              - user_profile
              - user_media
            client-name: Instagram
            provider: instagram

        provider:
          kakao:
            # 카카오 OAuth2 인증 서버 URI
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            # 카카오 OAuth2 토큰 발급 URI
            token-uri: https://kauth.kakao.com/oauth/token
            # 카카오 사용자 정보 조회 URI
            user-info-uri: https://kapi.kakao.com/v2/user/me
            # 사용자 이름 속성 (카카오는 "id" 사용)
            user-name-attribute: id
          # 상동 - 네이버는 response 안에 유저 정보가 있음
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          #상동
          instagram:
            authorization-uri: https://api.instagram.com/oauth/authorize
            token-uri: https://api.instagram.com/oauth/access_token
            user-info-uri: https://graph.instagram.com/me?fields=id,username,account_type
            user-name-attribute: id

#커스텀설정-root레벨
aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

media:
  presign:
    expire-seconds: ${MEDIA_PRESIGN_EXPIRE_SECONDS}
  orphan:
    expires-minutes: ${MEDIA_ORPHAN_EXPIRES_MINUTES}
  orphan-cleanup:
    fixed-delay-ms: ${MEDIA_ORPHAN_CLEANUP_FIXED_DELAY_MS}
  limits:
    image-bytes: ${MEDIA_LIMITS_IMAGE_BYTES}
    post-video-bytes: ${MEDIA_LIMITS_POST_VIDEO_BYTES}
    replay-video-bytes: ${MEDIA_LIMITS_REPLAY_VIDEO_BYTES}
    post-video-max-duration-seconds: ${MEDIA_LIMITS_POST_VIDEO_MAX_DURATION_SECONDS}
    replay-video-max-duration-seconds: ${MEDIA_LIMITS_REPLAY_VIDEO_MAX_DURATION_SECONDS}
  attachments:
    max-per-post: ${MEDIA_ATTACHMENTS_MAX_PER_POST}

# 정산 관련 설정
settlement:
  # 정산 배치 실행 스케줄 (매월 15일 오전 4시)
  batch:
    cron: ${SETTLEMENT_BATCH_CRON:0 0 4 15 * *}
  # 정산 복구 배치 실행 스케줄 (매일 새벽 2시)
  recovery:
    cron: ${SETTLEMENT_RECOVERY_CRON:0 0 2 * * *}

# 결제 관련 설정
payment:
  toss:
    base-url: https://api.tosspayments.com/v1
    client-key: ${PAYMENTS_CLIENT_KEY}
    secret-key: ${PAYMENTS_SECRET_KEY}

# OAuth2 로그인 성공 후 프론트엔드로 리다이렉트할 URI
# 환경 변수 OAUTH2_REDIRECT_URI로 설정 가능
#oauth2:
#  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000}
#oauth2:
#    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/login/success}
#테스트용 코드
jwt:
  secret: ${JWT_SECRET}
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:8080/callback.html}
