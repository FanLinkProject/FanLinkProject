server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:fanlink}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

  # 이메일 발송 설정 (Gmail SMTP 예시)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 이메일 개발 모드 설정
# true: 개발 모드 (콘솔에 인증 코드 출력, 실제 이메일 발송 안 함)
# false: 실제 이메일 발송
mail:
  dev-mode: ${MAIL_DEV_MODE:true}


# SMS API 설정 (실제 SMS 발송을 위한 설정 - CoolSMS)
sms:
  api:
    enabled: ${SMS_API_ENABLED:false}  # false: 개발 모드 (로그만 출력), true: 실제 SMS 발송
    key: ${SMS_API_KEY}
    secret: ${SMS_API_SECRET}
    from: ${SMS_FROM}  # 발신번호 (CoolSMS에 등록된 번호)

# 암호화 키 설정 (환경 변수 ENCRYPTION_KEY로 설정 가능, 32바이트 권장)
# 프로덕션 환경에서는 반드시 환경 변수로 설정하세요
encryption:
  key: ${ENCRYPTION_KEY:default-encryption-key-32bytes!!}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: ${KAFKA_GROUP_ID:chat-server}
      auto-offset-reset: earliest

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # (선택) consumer가 Json으로 받을 거면 설정 필요
    listener:
      missing-topics-fatal: false

aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

media:
  presign:
    expire-seconds: ${MEDIA_PRESIGN_EXPIRE_SECONDS}
  orphan:
    expires-minutes: ${MEDIA_ORPHAN_EXPIRES_MINUTES}
  orphan-cleanup:
    fixed-delay-ms: ${MEDIA_ORPHAN_CLEANUP_FIXED_DELAY_MS}
  limits:
    image-bytes: ${MEDIA_LIMITS_IMAGE_BYTES}
    post-video-bytes: ${MEDIA_LIMITS_POST_VIDEO_BYTES}
    replay-video-bytes: ${MEDIA_LIMITS_REPLAY_VIDEO_BYTES}
    post-video-max-duration-seconds: ${MEDIA_LIMITS_POST_VIDEO_MAX_DURATION_SECONDS}
    replay-video-max-duration-seconds: ${MEDIA_LIMITS_REPLAY_VIDEO_MAX_DURATION_SECONDS}
  attachments:
    max-per-post: ${MEDIA_ATTACHMENTS_MAX_PER_POST}

# 정산 관련 설정
settlement:
  # 정산 배치 실행 스케줄 (매월 15일 오전 4시)
  batch:
    cron: ${SETTLEMENT_BATCH_CRON:0 0 4 15 * *}
  # 정산 복구 배치 실행 스케줄 (매일 새벽 2시)
  recovery:
    cron: ${SETTLEMENT_RECOVERY_CRON:0 0 2 * * *}


payment:
  toss:
    base-url: https://api.tosspayments.com/v1
    client-key: ${PAYMENTS_CLIENT_KEY}
    secret-key: ${PAYMENTS_SECRET_KEY}
