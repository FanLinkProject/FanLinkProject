server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:fanlinkdb}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

  # 이메일 발송 설정 (Gmail SMTP 예시)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:hyen20902@gmail.com}
    password: ${MAIL_PASSWORD:wwecbxjfkgzyugyn}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# SMS API 설정 (실제 SMS 발송을 위한 설정 - CoolSMS)
sms:
  api:
    enabled: ${SMS_API_ENABLED:false}  # false: 개발 모드 (로그만 출력), true: 실제 SMS 발송
    key: ${SMS_API_KEY:NCS9IYN7V6XVXFCY}
    secret: ${SMS_API_SECRET:0OEALX4OKX2DIQS8GY4FMUDXK9ZKJVF6}
    from: ${SMS_FROM:01083368078}  # 발신번호 (CoolSMS에 등록된 번호)

# 암호화 키 설정 (환경 변수 ENCRYPTION_KEY로 설정 가능, 32바이트 권장)
# 프로덕션 환경에서는 반드시 환경 변수로 설정하세요
encryption:
  key: ${ENCRYPTION_KEY:default-encryption-key-32bytes!!}


aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

media:
  presign:
    expire-seconds: ${MEDIA_PRESIGN_EXPIRE_SECONDS}
  orphan:
    expires-minutes: ${MEDIA_ORPHAN_EXPIRES_MINUTES}
  orphan-cleanup:
    fixed-delay-ms: ${MEDIA_ORPHAN_CLEANUP_FIXED_DELAY_MS}
  limits:
    image-bytes: ${MEDIA_LIMITS_IMAGE_BYTES}
    post-video-bytes: ${MEDIA_LIMITS_POST_VIDEO_BYTES}
    replay-video-bytes: ${MEDIA_LIMITS_REPLAY_VIDEO_BYTES}
    post-video-max-duration-seconds: ${MEDIA_LIMITS_POST_VIDEO_MAX_DURATION_SECONDS}
    replay-video-max-duration-seconds: ${MEDIA_LIMITS_REPLAY_VIDEO_MAX_DURATION_SECONDS}
  attachments:
    max-per-post: ${MEDIA_ATTACHMENTS_MAX_PER_POST}
