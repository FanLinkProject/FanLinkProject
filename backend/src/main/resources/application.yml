server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:fanlinkdb}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: ${KAFKA_GROUP_ID:chat-server}
      auto-offset-reset: earliest

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # (선택) consumer가 Json으로 받을 거면 설정 필요
    listener:
      missing-topics-fatal: false

aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

media:
  presign:
    expire-seconds: ${MEDIA_PRESIGN_EXPIRE_SECONDS}
  orphan:
    expires-minutes: ${MEDIA_ORPHAN_EXPIRES_MINUTES}
  orphan-cleanup:
    fixed-delay-ms: ${MEDIA_ORPHAN_CLEANUP_FIXED_DELAY_MS}
  limits:
    image-bytes: ${MEDIA_LIMITS_IMAGE_BYTES}
    post-video-bytes: ${MEDIA_LIMITS_POST_VIDEO_BYTES}
    replay-video-bytes: ${MEDIA_LIMITS_REPLAY_VIDEO_BYTES}
    post-video-max-duration-seconds: ${MEDIA_LIMITS_POST_VIDEO_MAX_DURATION_SECONDS}
    replay-video-max-duration-seconds: ${MEDIA_LIMITS_REPLAY_VIDEO_MAX_DURATION_SECONDS}
  attachments:
    max-per-post: ${MEDIA_ATTACHMENTS_MAX_PER_POST}
