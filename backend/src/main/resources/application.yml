server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:fanlinkdb}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# 암호화 키 설정 (환경 변수 ENCRYPTION_KEY로 설정 가능, 32바이트 권장)
# 프로덕션 환경에서는 반드시 환경 변수로 설정
encryption:
  key: ${ENCRYPTION_KEY:default-encryption-key-32bytes!!}
