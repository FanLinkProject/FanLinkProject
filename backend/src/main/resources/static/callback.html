<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 성공!</title>
    <style>
        body { font-family: monospace; padding: 40px; background-color: #282c34; color: #abb2bf; }
        h2 { color: #98c379; }
        .token-box { background: #1e2127; padding: 20px; border-radius: 10px; word-break: break-all; border: 1px solid #3e4451; margin-bottom: 20px; }
        .label { color: #61afef; font-weight: bold; margin-bottom: 10px; display: block; }
        .value { color: #e06c75; }
        button { padding: 10px 20px; cursor: pointer; background: #61afef; border: none; border-radius: 5px; color: white; font-weight: bold; font-size: 16px; }
        button:hover { background: #4d8ec4; }
    </style>
</head>
<body>
<h2>🎉 로그인 성공! (프론트엔드 시뮬레이션)</h2>
<p>백엔드에서 발급한 JWT 토큰이 도착했습니다.</p>

<div class="token-box">
    <span class="label">Access Token:</span>
    <div id="accessToken" class="value"></div>
</div>

<div class="token-box">
    <span class="label">Refresh Token:</span>
    <div id="refreshToken" class="value"></div>
</div>

<button onclick="copyTokens()">콘솔에 토큰 복사하기</button>
<br><br>
<a href="/index.html" style="color: #98c379;">다시 로그인하기</a>

<script>
    // 1. URL 쿼리 파라미터에서 토큰 추출
    const params = new URLSearchParams(window.location.search);
    const accessToken = params.get('accessToken');
    const refreshToken = params.get('refreshToken');

    // 2. 화면에 표시
    document.getElementById('accessToken').innerText = accessToken || "토큰 없음";
    document.getElementById('refreshToken').innerText = refreshToken || "토큰 없음";

    // 3. 브라우저 콘솔에도 출력 (개발자 도구 F12 확인용)
    console.log("Access Token:", accessToken);
    console.log("Refresh Token:", refreshToken);

    // 4. (보안) 주소창에서 토큰 지우기 시뮬레이션
    if (accessToken) {
        window.history.replaceState({}, null, "/callback.html"); // URL 세탁
    }

    function copyTokens() {
        const text = `Access: ${accessToken}\nRefresh: ${refreshToken}`;
        navigator.clipboard.writeText(text).then(() => alert("클립보드에 복사되었습니다!"));
    }
</script>
</body>
</html>
