<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FanLink 로그인 테스트</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f5f5f5; }
        h1 { color: #333; margin-bottom: 30px; }
        .btn-container { display: flex; flex-direction: column; gap: 15px; width: 300px; }
        .btn { display: block; width: 100%; padding: 15px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; font-size: 16px; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.02); opacity: 0.9; }

        .google { background-color: #ffffff; color: #444; border: 1px solid #ddd; }
        .kakao { background-color: #FEE500; color: #000000; border: none; }
        .naver { background-color: #03C75A; color: #ffffff; border: none; }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; border: none; }
    </style>
</head>
<body>
<h1>FanLink 로그인 테스트</h1>
<div class="btn-container">
    <!-- 백엔드 SecurityConfig에 설정된 주소로 요청을 보냅니다 -->
    <a href="/oauth2/authorization/google" class="btn google">Google 로그인</a>
    <a href="/oauth2/authorization/kakao" class="btn kakao">Kakao 로그인</a>
    <a href="/oauth2/authorization/naver" class="btn naver">Naver 로그인</a>
    <a href="/oauth2/authorization/instagram" class="btn instagram">Instagram 로그인</a>
</div>
</body>
</html>
